# Databricks Asset Bundle for the analytical layer (ADR-0003; setup in README.md).
#   databricks bundle deploy -t free --var warehouse_id=<id>
# Deploys the dbt project and the medallion SQL to the workspace and defines the analytics job
# that the verda lakehouse job starts daily (Jobs API run-now with as_of and export_date):
#   1. bronze_silver: databricks/sql/medallion.sql on the SQL warehouse
#   2. gold: the shared dbt models tagged `lakehouse` (baseline_observations, baselines,
#      backtest_deals) at the run's as_of, on the same warehouse
# Deployed and run on Free Edition: see "What has been verified" in README.md.
bundle:
  name: flight_scanner

sync:
  paths:
    - ../dbt
    - ./sql

variables:
  warehouse_id:
    description: The serverless SQL warehouse that runs both tasks (Free Edition has one).
  catalog:
    description: Unity Catalog catalog holding bronze/silver/gold and the exports volume.
    default: flight_scanner

targets:
  free:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}

resources:
  jobs:
    analytics:
      name: flight-scanner-analytics
      max_concurrent_runs: 1
      parameters:
        - name: as_of
          default: ""
        - name: export_date
          default: ""
      tasks:
        - task_key: bronze_silver
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              # sync reaches ../dbt, so files are uploaded relative to the repo root
              path: ${workspace.file_path}/databricks/sql/medallion.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
        - task_key: gold
          depends_on:
            - task_key: bronze_silver
          environment_key: dbt
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: silver
            commands:
              - "dbt build --select tag:lakehouse --vars '{as_of: \"{{job.parameters.as_of}}\"}'"
      environments:
        - environment_key: dbt
          spec:
            client: "2"
            dependencies:
              - "dbt-databricks>=1.10,<2"
