# Kustomize (built into kubectl: `kubectl apply -k`) combines plain YAML manifests. This base
# describes the app the same way everywhere. The overlays add or patch the parts that differ,
# such as where Postgres runs, storage classes and image names, without copying the rest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every resource below is created in this namespace.
namespace: flight-scanner

labels:
  - pairs:
      app.kubernetes.io/part-of: flight-scanner

resources:
  - namespace.yaml
  - api.yaml
  - dagster.yaml
  - web.yaml

# Not here: Postgres. overlays/aks and overlays/local add it from components/in-cluster-postgres;
# overlays/openshift points the app at a managed PostgreSQL instead.

# Not listed: the Secret `flight-scanner-env`, made from your .env by the deploy script. Secrets
# are never committed.
