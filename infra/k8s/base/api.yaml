# The FastAPI app. A Deployment keeps the requested number of identical pods running and
# replaces them one by one when the image changes (a rolling update).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Init containers run to completion before the main container starts. The API applies
      # migrations as it starts and exits if Postgres isn't reachable yet, so wait for it here
      # instead of crash-looping until it is.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16 # only for its pg_isready
          # The same connection settings as the app: host and port from the in-cluster Postgres
          # ConfigMap or from .env, PGSSLMODE from .env if set. -U avoids libpq looking up the
          # container's user, which fails under the random user IDs OpenShift assigns.
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "${POSTGRES_PORT:-5432}" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          envFrom:
            - secretRef:
                name: flight-scanner-env
            - configMapRef:
                name: flight-scanner-db
                optional: true
      containers:
        - name: api
          image: flight-scanner-python # the overlay sets the registry and tag
          command: ["uvicorn", "flight_scanner.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: flight-scanner-env
            - configMapRef:
                name: flight-scanner-db
                optional: true
          # /health queries Postgres, so it answers "can this pod serve requests?" (readiness).
          # It must not decide liveness: a Postgres outage would then restart a healthy API
          # over and over. Liveness only asks whether the process still accepts connections.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
---
# Reached by the UI at http://api:8000.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
