# The Next.js UI. It proxies /api to the API's Service, so the UI is the only port you need.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: flight-scanner-web
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_URL
              value: http://api:8000 # the api Service, resolved by cluster DNS
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# ClusterIP (the default): reachable only inside the cluster. Nothing here is public, because
# the API has no login. You reach the UI with `kubectl port-forward` (infra/README.md).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: http
