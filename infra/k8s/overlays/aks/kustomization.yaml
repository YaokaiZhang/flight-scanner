# The base, plus what is specific to AKS: Azure storage classes. infra/deploy.sh adds the image
# names (registry and git commit tag) on top of this when it deploys.
# Preview what would be applied: kubectl kustomize infra/k8s/overlays/aks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/in-cluster-postgres

# The base sets this for its own resources; set here too, it also covers the component's.
namespace: flight-scanner

patches:
  # Azure Files (SMB): the only built-in AKS storage that several nodes can mount at once.
  - target:
      kind: PersistentVolumeClaim
      name: raw-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: azurefile-csi
  # Azure managed disk, Standard SSD (AKS's default class, made explicit).
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: managed-csi
