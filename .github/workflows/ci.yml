name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The tests start their own throwaway clusters, so only the binaries are needed.
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: scripts/test.sh
        env:
          FS_TEST_WORKERS: "4"

  # Static checks of the Azure deployment. Nothing here touches Azure: validate checks the
  # configuration against the provider's schema, kubeconform checks the manifests against the
  # Kubernetes API schemas.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate
        run: |
          for dir in infra/terraform infra/terraform/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: kubeconform
        run: |
          for overlay in aks local openshift; do
            kubectl kustomize "infra/k8s/overlays/$overlay" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.34.0 -
          done
      - run: bash -n infra/lib.sh infra/deploy.sh infra/deploy-openshift.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build generates next-env.d.ts, which the typecheck needs.
      - run: npm run build
      - run: npm run typecheck
