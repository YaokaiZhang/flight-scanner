version: 2

models:
  - name: stg_leg_prices
    description: Leg prices in EUR per adult, one row per Fare observation.
    columns:
      - name: payload_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "source('landing', 'raw_payloads')", field: id}
      - name: source
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]
      - name: origin
        data_tests: [not_null]
      - name: destination
        data_tests: [not_null]
      - name: departure_date
        data_tests: [not_null]
      - name: price_per_adult_eur
        data_tests: [not_null]
  - name: stg_round_trip_prices
    description: Round-trip prices in EUR per adult, one row per Fare observation.
    columns:
      - name: payload_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "source('landing', 'raw_payloads')", field: id}
      - name: departure_date
        data_tests: [not_null]
      - name: return_date
        data_tests: [not_null]
      - name: price_per_adult_eur
        data_tests: [not_null]
