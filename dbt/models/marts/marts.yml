version: 2

models:
  - name: candidates
    description: >
      Trips whose observed (possibly cached) price passes the Deal test but are not yet
      confirmed live. One row per Alert dedup key.
    data_tests:
      - unique_combination:
          arguments:
            columns: [watch_id, origin, destination, outbound_date, return_date]
    columns:
      - name: watch_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "source('app', 'watches')", field: id}
      - name: origin
        data_tests: [not_null]
      - name: destination
        data_tests: [not_null]
      - name: outbound_date
        data_tests: [not_null]
      - name: price_total_eur
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
