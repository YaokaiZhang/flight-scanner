version: 2

models:
  - name: trip_prices
    description: >
      Trip composition (ADR-0001): the current cheapest price per adult of every Watch slot,
      from a one-way Leg price, two separate Leg-price tickets, or a single-ticket Round-trip
      price, whichever is cheaper. One row per slot that has a price.
    data_tests:
      - unique_combination:
          arguments:
            columns: [watch_id, origin, destination, outbound_date, return_date]
    columns:
      - name: watch_id
        data_tests: [not_null]
      - name: origin
        data_tests: [not_null]
      - name: destination
        data_tests: [not_null]
      - name: outbound_date
        data_tests: [not_null]
      - name: ticketing
        description: How the price is booked, which decides the price composition (ADR-0001).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_way, single_ticket, separate_tickets]
      - name: price_per_adult_eur
        description: Cheapest current price for one adult, in EUR.
        data_tests: [not_null]
      - name: source
        description: The source that reported the price.
        data_tests: [not_null]
      - name: observed_at
        description: When the price was observed; cached sources may be older than the scan.
        data_tests: [not_null]
  - name: candidates
    description: >
      Trips whose observed (possibly cached) price passes the Deal test but are not yet
      confirmed live. One row per Alert dedup key.
    data_tests:
      - unique_combination:
          arguments:
            columns: [watch_id, origin, destination, outbound_date, return_date]
    columns:
      - name: watch_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "source('app', 'watches')", field: id}
      - name: origin
        data_tests: [not_null]
      - name: destination
        data_tests: [not_null]
      - name: outbound_date
        data_tests: [not_null]
      - name: ticketing
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_way, single_ticket, separate_tickets]
      - name: price_total_eur
        description: Price for all the Watch's adults, in EUR.
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
      - name: separate_tickets
        description: True when the trip is two independently booked one-way tickets.
        data_tests: [not_null]
      - name: baseline_tier
        description: Tier of the Baseline the trip was judged against (null = threshold only).
        data_tests:
          - accepted_values:
              arguments:
                values: [route, country, price_insight, provisional]
