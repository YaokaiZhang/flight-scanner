version: 2

# On Databricks every source is a silver table loaded from the daily export (same table name).
sources:
  - name: landing
    schema: "{{ 'silver' if target.type == 'databricks' else 'landing' }}"
    description: Rows parsed by source adapters (Python), one per raw payload row.
    tables:
      - name: raw_payloads
        description: Every source answer as received; the parsed rows point back to it.
      - name: leg_prices
        description: One-way prices as a source reported them, one row per Fare observation.
        config: &fresh
          loaded_at_field: observed_at
          # Scans start every 30 minutes and the longest healthy one took 52. The Verification
          # source only checks Candidates, so its rows say nothing about scans.
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
            filter: source <> 'serpapi'
        columns:
          - name: currency
            data_tests:
              - relationships:  # staging drops currencies without an fx_rates row
                  arguments: {to: "ref('fx_rates')", field: currency}
                  config: {severity: warn}
      - name: round_trip_prices
        description: Single-ticket round-trip prices as a source reported them.
        config: *fresh
        columns:
          - name: currency
            data_tests:
              - relationships:
                  arguments: {to: "ref('fx_rates')", field: currency}
                  config: {severity: warn}
      - name: price_insights
        description: Price insights (typical price range of one trip) from Verification answers.
        columns:
          - name: currency
            data_tests:
              - relationships:
                  arguments: {to: "ref('fx_rates')", field: currency}
                  config: {severity: warn}
  - name: app
    schema: "{{ 'silver' if target.type == 'databricks' else 'app' }}"
    description: Application tables owned by Python (Watches, slots, Deals, Alerts).
    tables:
      - name: watches
      - name: watch_slots
      - name: quality_gates
        description: >
          Slices (source, origin; origin null = the whole source) failing a data-quality check
          (flight_scanner.data_quality); their prices are left out of trip prices.
      - name: deals
      - name: alerts
  - name: ref
    schema: "{{ 'silver' if target.type == 'databricks' else 'ref' }}"
    description: Reference data written by Python from the bundled Places snapshot.
    tables:
      - name: airports
        description: City (null when unknown) and country of every airport; reference_version.
  - name: analytics
    schema: "{{ 'silver' if target.type == 'databricks' else 'analytics' }}"
    description: What the lakehouse (Databricks, ADR-0003) wrote back; owned by Python.
    tables:
      - name: baseline_versions
        description: >
          Baseline versions the lakehouse published (change-only; method prefixed with the
          engine, e.g. databricks/daily_min_median_60d).
