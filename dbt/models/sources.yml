version: 2

sources:
  - name: landing
    description: Rows parsed by source adapters (Python), one per raw payload row.
    tables:
      - name: raw_payloads
      - name: leg_prices
        columns:
          - name: currency
            data_tests:
              - relationships:  # staging drops currencies without an fx_rates row
                  arguments: {to: "ref('fx_rates')", field: currency}
                  config: {severity: warn}
      - name: round_trip_prices
        columns:
          - name: currency
            data_tests:
              - relationships:
                  arguments: {to: "ref('fx_rates')", field: currency}
                  config: {severity: warn}
  - name: app
    description: Application tables owned by Python (Watches, slots).
    tables:
      - name: watches
      - name: watch_slots
