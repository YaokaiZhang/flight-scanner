name: flight_scanner
version: "0.1.0"
config-version: 2
profile: flight_scanner

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

# Shared models must stay adapter-portable (ADR-0003): no Postgres-only SQL (DISTINCT ON, ::casts,
# now()); use window functions, cross-db macros and the `as_of()` macro for the clock.
vars:
  as_of: null  # the injected clock for runs by hand; the pipeline sets env FS_AS_OF (see as_of())
  # Baselines (spec defaults)
  baseline_window_days: 60  # trailing window of observation days
  baseline_min_observations: 20  # route/country support: daily-minimum trip prices ...
  baseline_min_days: 7  # ... spread over at least this many distinct observation days
  provisional_min_trips: 5  # provisional Baseline: trips (departure dates) in the key
  # Verification (ticket 08): sources that only check Candidates live. Their prices (and Price-
  # insight history) are Fare observations for Baselines but never a trip's current price.
  verification_sources: ["serpapi"]

models:
  flight_scanner:
    staging:
      +schema: staging
      +materialized: view
    history:
      +schema: history
      +materialized: table
    baselines:
      +schema: marts
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  flight_scanner:
    +schema: staging
