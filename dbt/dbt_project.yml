name: flight_scanner
version: "0.1.0"
config-version: 2
profile: flight_scanner

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

# Shared models must stay adapter-portable (ADR-0003): no Postgres-only SQL (DISTINCT ON, ::casts,
# now()); use window functions, cross-db macros and the `as_of()` macro for the clock.
vars:
  as_of: null  # the injected clock for runs by hand; the pipeline sets env FS_AS_OF (see as_of())
  # Baselines (spec defaults)
  baseline_window_days: 60  # trailing window of observation days
  baseline_min_observations: 20  # route/country support: daily-minimum trip prices ...
  baseline_min_days: 7  # ... spread over at least this many distinct observation days
  provisional_min_trips: 5  # provisional Baseline: trips (departure dates) in the key
  # Analytical layer (ticket 12): Baselines the lakehouse published are used for detection
  # until they are this old; then the operational recompute takes over again.
  published_baseline_max_age_days: 7
  # Backtest (marts.backtest_deals)
  backtest_recovery_share: 0.5  # a real dip: a later price climbs this share back to the Baseline
  backtest_min_later_days: 3  # ... else "stayed low" once this many later days were observed
  # Verification (ticket 08): sources that only check Candidates live. Their prices (and Price-
  # insight history) are Fare observations for Baselines but never a trip's current price.
  verification_sources: ["serpapi"]

models:
  flight_scanner:
    staging:
      +schema: staging
      +materialized: view
    history:
      +schema: history
      +materialized: table
    baselines:
      +schema: marts
      +materialized: table
      # the models the lakehouse (Databricks job) builds: `--select tag:lakehouse`
      baseline_observations: {+tags: [lakehouse]}
      baselines: {+tags: [lakehouse]}
    marts:
      +schema: marts
      +materialized: table
    backtest:
      +schema: marts
      +materialized: table
      +tags: [lakehouse]

seeds:
  flight_scanner:
    +schema: staging
